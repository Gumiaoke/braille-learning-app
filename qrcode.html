<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>点点盲文学习机 - 扫码访问</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(175deg,#E3F2FD,#F0F8FF,#F5FAFE,#FFF);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);
  border-radius:28px;padding:36px 28px;text-align:center;
  box-shadow:0 8px 40px rgba(126,216,255,0.2);max-width:380px;width:100%;
  border:1px solid rgba(126,216,255,0.15);
}
h1{font-size:20px;color:#2C3E50;margin-bottom:2px}
.badge{display:inline-block;background:linear-gradient(135deg,#9BE7C4,#7DC9A0);color:#fff;font-size:10px;padding:3px 12px;border-radius:20px;margin-bottom:14px;font-weight:700}
.sub{font-size:13px;color:#7F8C8D;margin-bottom:18px}
.qr-box{background:#F5FAFE;border-radius:16px;padding:16px;display:inline-block;margin-bottom:14px;border:2px solid #D4EFFA}
.qr-box img{display:block;width:220px;height:220px;border-radius:8px}
.step{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:#2C3E50}
.num{background:linear-gradient(135deg,#7ED8FF,#5BC0EB);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.url{background:#F0F8FF;border-radius:8px;padding:10px;font-size:11px;color:#2980B9;word-break:break-all;margin-top:14px;font-family:Consolas,monospace}
</style>
</head>
<body>
<div class="card">
  <span class="badge">🔒 永久地址</span>
  <h1>点点盲文学习机</h1>
  <p class="sub">AI智能陪伴 · 快乐学习盲文</p>
  <div class="qr-box">
    <img src="scan-qr.png" alt="QR Code">
  </div>
  <div class="step"><span class="num">1</span>打开微信</div>
  <div class="step"><span class="num">2</span>右上角 ⊕ → 扫一扫</div>
  <div class="step"><span class="num">3</span>扫描上方二维码</div>
  <div class="step"><span class="num">4</span>手机上打开App</div>
  <div class="url">https://gumiaoke.github.io/braille-learning-app/</div>
</div>
</body>
</html>
